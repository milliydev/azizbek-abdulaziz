<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Naruto Anime &amp; Shop</title>
  <meta name="description" content="Naruto Anime & Shop — watch episodes, shop clothing and accessories, get episodes in Telegram." />
  <meta name="theme-color" content="#0b0a0f" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0a0f'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23ff7a18' font-family='serif'%3E%E5%BF%8D%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <canvas id="chakra" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <!-- Intro loader -->
  <div id="loader" aria-hidden="true">
    <div class="loader-kanji">忍</div>
    <div class="loader-bar"><span></span></div>
  </div>

  <header class="header" id="header">
    <div class="container header-inner">
      <a href="#/" class="logo" aria-label="Home">
        <span class="logo-mark">忍</span>
        <span class="logo-text">NARUTO<small>ANIME &amp; SHOP</small></span>
      </a>

      <nav class="nav" id="nav">
        <a href="#/" data-i18n="nav.home" data-route="home"></a>
        <a href="#/shop" data-i18n="nav.shop" data-route="shop"></a>
        <a href="#/watch" data-i18n="nav.watch" data-route="watch"></a>
        <a href="#/news" data-i18n="nav.news" data-route="news"></a>
        <a href="#/about" data-i18n="nav.about" data-route="about"></a>
        <a href="#/contacts" data-i18n="nav.contacts" data-route="contacts"></a>
      </nav>

      <div class="header-actions">
        <div class="lang" id="lang">
          <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
            <span id="langCurrent">RU</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul class="lang-menu" role="listbox">
            <li role="option" data-lang="en"><span class="flag">EN</span> English</li>
            <li role="option" data-lang="ru"><span class="flag">RU</span> Русский</li>
          </ul>
        </div>
        <a href="#/profile" class="icon-btn" aria-label="Profile">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        </a>
        <a href="#/cart" class="icon-btn cart-btn" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </a>
        <button class="burger" id="burger" aria-label="Menu"><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <a href="#/" class="logo"><span class="logo-mark">忍</span><span class="logo-text">NARUTO<small>ANIME &amp; SHOP</small></span></a>
        <p class="muted" data-i18n="footer.tagline"></p>
      </div>
      <div>
        <h4 data-i18n="footer.explore"></h4>
        <a href="#/shop" data-i18n="nav.shop"></a>
        <a href="#/watch" data-i18n="nav.watch"></a>
        <a href="#/news" data-i18n="nav.news"></a>
      </div>
      <div>
        <h4 data-i18n="footer.help"></h4>
        <a href="#/profile" data-i18n="nav.track"></a>
        <a href="#/contacts" data-i18n="nav.contacts"></a>
        <a href="#/about" data-i18n="nav.about"></a>
      </div>
      <div>
        <h4>Telegram</h4>
        <a class="tg-link" target="_blank" rel="noopener" data-i18n="footer.bot"></a>
      </div>
    </div>
    <div class="container footer-bottom">
      <span>© <span id="year"></span> Naruto Anime &amp; Shop</span>
      <span class="muted" data-i18n="footer.disclaimer"></span>
    </div>
  </footer>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" class="modal" hidden><div class="modal-card"><button class="modal-close" aria-label="Close">×</button><div class="modal-body"></div></div></div>

  <!-- GSAP 3.12.5 is bundled locally (also available on cdnjs) -->
  <script src="/vendor/gsap.min.js"></script>
  <script src="/vendor/ScrollTrigger.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
